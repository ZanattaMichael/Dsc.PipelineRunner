name: Azure DevOps Real Lifecycle DSC v3 Self-Hosted

# Proves the full end-to-end path against a live Azure DevOps organization THROUGH THE DSC v3 ENGINE:
# compile the real Datum Example Configuration through the runner, authenticate with managed identity
# via the AzureDevOpsDscNative resource module, then genuinely build and tear down the environment by
# driving `dsc.exe` (Actions/Engine/DscV3.ps1 -> `dsc resource set/test --resource AzureDevOpsDscNative/...`)
# rather than Invoke-DscResource. This is the v3 sibling of AzureDevOps-SelfHosted.yml.
#
# It needs a real `dsc` executable, the IMDS metadata endpoint (system-assigned managed identity), a
# real Azure DevOps org, and the AzureDevOpsDscNative module, so it runs on a self-hosted runner rather
# than the hosted Linux agents.
#
# Configuration:
#   - vars.AZDO_ORGANIZATION_NAME (repository Actions variable): overrides the Example
#     Configuration's Organization_Name at runtime. Defaults to the config value when unset.

on:
  push:
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

  # Reused as a release gate by the tag-driven Release workflow.
  workflow_call:

jobs:
  azuredevops-v3-selfhosted:
    name: Azure DevOps real lifecycle (DSC v3) on self-hosted
    runs-on: [self-hosted]

    env:
      # The AzureDevOpsDsc.Common managed-identity provider requires a writable cache directory or it
      # throws before authenticating. It is ALSO how the persisted session reaches dsc.exe's PowerShell
      # adapter child processes: they inherit this env var and re-import ModuleSettings.clixml from it.
      AZDODSC_CACHE_DIRECTORY: ${{ github.workspace }}/.azdodsc-cache
      # Repo-level Actions variable; the suite falls back to the config's Organization_Name when unset.
      AZDO_ORGANIZATION_NAME: ${{ vars.AZDO_ORGANIZATION_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:AZDODSC_CACHE_DIRECTORY | Out-Null

      # Install only what is missing so a warm runner is not re-provisioned every run.
      #  - Pester is pinned to the 5.x line (New-PesterConfiguration's schema differs across major
      #    versions). -SkipPublisherCheck is required because the runner ships an older Pester (4.x)
      #    signed by a different Authenticode publisher.
      #  - powershell-yaml / datum / datum.invokecommand compile the Example Configuration.
      #  - AzureDevOpsDscNative provides the AzDo* DSC resources and the bundled AzureDevOpsDsc.Common
      #    managed-identity provider; it is prerelease on the gallery. Installing it CurrentUser puts it
      #    on PSModulePath so dsc.exe's PowerShell adapter can enumerate its class-based resources.
      - name: Ensure PowerShell dependencies
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -eq 5 })) {
            Write-Host "Installing Pester (5.x) ..."
            Install-Module -Name Pester -MinimumVersion '5.0.0' -MaximumVersion '5.9999.9999' `
              -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          }
          foreach ($m in 'powershell-yaml','datum','datum.invokecommand') {
            if (-not (Get-Module -ListAvailable -Name $m)) {
              Write-Host "Installing $m ..."
              Install-Module -Name $m -Force -Scope CurrentUser -AllowClobber
            }
          }
          if (-not (Get-Module -ListAvailable -Name AzureDevOpsDscNative)) {
            Write-Host "Installing AzureDevOpsDscNative (prerelease) ..."
            Install-Module -Name AzureDevOpsDscNative -AllowPrerelease -Force -Scope CurrentUser -AllowClobber
          }

      # Bootstrap Microsoft's DSC v3 executable and add it to PATH (Install-DscV3.ps1 appends to
      # $GITHUB_PATH, so later steps see `dsc`). DSC v3 shipped previews for a long time, so include
      # prereleases when resolving 'latest'. Skipped if a `dsc` is already on PATH (warm runner).
      - name: Ensure DSC v3 executable
        shell: pwsh
        run: |
          if (Get-Command -Name dsc -CommandType Application -ErrorAction SilentlyContinue) {
            Write-Host "dsc already present: $((Get-Command dsc).Source)"
          }
          else {
            ./scripts/Install-DscV3.ps1 -IncludePrerelease -Verbose
          }

      - name: Report environment
        shell: pwsh
        run: |
          $PSVersionTable | Format-List
          Get-Module -ListAvailable -Name AzureDevOpsDscNative | Format-List Name, Version, Path
          $dsc = Get-Command -Name dsc -CommandType Application -ErrorAction SilentlyContinue
          if ($dsc) {
            Write-Host "dsc: $($dsc.Source)"
            & $dsc.Source --version
            Write-Host "--- dsc resource list (AzureDevOpsDscNative) ---"
            & $dsc.Source resource list --output-format json 2>&1 |
              Select-String -Pattern 'AzureDevOpsDscNative'
          }
          else {
            Write-Warning "dsc is not on PATH."
          }

      # Compile the real Datum Example Configuration and drive a genuine build/teardown against the
      # live Azure DevOps org via managed identity, through the DSC v3 engine (no mocks).
      - name: Run Azure DevOps DSC v3 real-lifecycle integration tests
        shell: pwsh
        run: ./scripts/Invoke-AzureDevOpsV3SelfHostedTests.ps1

      # Publish the invocation results (NUnit XML) as a build artifact, even when the suite fails, so
      # the record of the real DSC v3 build/teardown run is downloadable from the run summary.
      - name: Publish invocation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azuredevops-real-lifecycle-dscv3-results
          path: output/testResults/AzureDevOps-RealLifecycle-DscV3.TestResults.xml
          if-no-files-found: warn
