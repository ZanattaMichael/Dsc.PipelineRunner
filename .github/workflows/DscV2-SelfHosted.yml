name: DSC v2 Self-Hosted Agent

# Proves the DSC v2 (Invoke-DscResource) engine path works on a real PowerShell-DSC host:
# drive a live, dependency-free DSC resource through the runner's DscV2 engine and assert a
# contract-valid result, then run the build/teardown lifecycle integration suite. Invoke-DscResource
# is the Windows / PowerShell-DSC path, so this runs on a self-hosted Windows + PowerShell 7
# runner (the hosted Linux agents cover the DSC v3 path in DscV3-HostedAgent.yml).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

  # Reused as a release gate by the tag-driven Release workflow.
  workflow_call:

# Serialize (don't cancel) superseded runs for the same branch/PR: this workflow drives a real
# self-hosted PowerShell-DSC host, so killing an in-progress run risks leaving it mid-apply.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dsc-v2-selfhosted:
    name: DSC v2 engine on self-hosted
    runs-on: [self-hosted]

    steps:
      - uses: actions/checkout@v4

      # Pester v5 (for the integration suite) and PSDesiredStateConfiguration (for
      # Invoke-DscResource on PowerShell 7). Installed only when missing so a warm runner is
      # not re-provisioned on every run.
      #
      # Pester is pinned to the 5.x line the rest of the suite uses (New-PesterConfiguration's
      # schema differs across major versions). -SkipPublisherCheck is required because the
      # runner ships an older Pester (4.x) signed by a different Authenticode publisher, which
      # otherwise blocks installing the 5.x side-by-side.
      - name: Ensure PowerShell dependencies
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -eq 5 })) {
            Write-Host "Installing Pester (5.x) ..."
            Install-Module -Name Pester -MinimumVersion '5.0.0' -MaximumVersion '5.9999.9999' `
              -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          }
          if (-not (Get-Module -ListAvailable -Name PSDesiredStateConfiguration)) {
            Write-Host "Installing PSDesiredStateConfiguration ..."
            Install-Module -Name PSDesiredStateConfiguration -Force -Scope CurrentUser -AllowClobber
          }

      - name: Report DSC v2 environment
        shell: pwsh
        run: |
          $PSVersionTable | Format-List
          Get-Command Invoke-DscResource | Format-List Name, Source, Version

      # Exercise the module's real DscV2 engine action against a live resource (no mocks).
      - name: Run DSC v2 engine smoke test
        shell: pwsh
        run: ./scripts/Test-DscV2Smoke.ps1 -Verbose

      # Run the build/teardown lifecycle integration suite through a real Invoke-DscResource.
      - name: Run DSC v2 real-engine integration tests
        shell: pwsh
        run: ./scripts/Invoke-DscV2SelfHostedTests.ps1

      # Configure a WinRM listener when the runner has none, so the suite below runs its live
      # connection tests instead of skipping them with a warning. Probes first and makes no
      # changes on a runner that is already reachable, appends to TrustedHosts rather than
      # replacing it, and never fails the job: an environment problem on the runner must not
      # turn an unrelated pull request red. The outcome is written to the run summary.
      - name: Ensure WinRM is enabled
        shell: pwsh
        run: ./scripts/Enable-SelfHostedWinRM.ps1

      # Validate Actions/Target/WinRM.ps1 against a live WinRM listener rather than the mocked
      # New-CimSession/New-PSSession the unit suite uses. This is the only runner in CI that can:
      # the hosted Linux agents have no WSMan stack. The suite connects to this runner itself, so
      # it needs no second machine, and skips itself with a warning if the listener is unreachable.
      - name: Run WinRM remoting integration tests
        shell: pwsh
        run: ./scripts/Invoke-RemotingSelfHostedTests.ps1
