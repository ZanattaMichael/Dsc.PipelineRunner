# Manually computes the SHA-256 of every DSC v3 archive in a release, cross-checking each one
# against the digest GitHub publishes, and prints the resulting scripts/dsc-checksums.json.
#
# It does not commit anything: a maintainer reviews the output and updates the lock file in a
# pull request, so the pin is a reviewed change rather than something a workflow can do alone.
# The generated file is uploaded as an artifact and printed in the job log.
name: Update DSC checksums

on:
  # Also runs on a pull request that changes the pinning script or this workflow, so a change to
  # either is exercised by CI (it only reads upstream release assets and has no secrets).
  pull_request:
    paths:
      - 'scripts/Update-DscChecksums.ps1'
      - '.github/workflows/Update-DscChecksums.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'DSC release tag to pin (for example v3.3.0). Blank uses the lock file default.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  checksums:
    name: Compute DSC archive checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute checksums
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $arguments = @{ OutputPath = './dsc-checksums.generated.json'; Verbose = $true }
          if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION)) { $arguments.Version = $env:REQUESTED_VERSION }
          ./scripts/Update-DscChecksums.ps1 @arguments

      # The container base image is pinned by digest, and a digest is only worth pinning if it is
      # the one the registry really serves. Resolve it here, on a GitHub runner, rather than
      # copying one from anywhere else. The multi-architecture index digest is what a Dockerfile
      # FROM line should carry, so the same pin works on x86_64 and arm64.
      - name: Resolve the container base image digest
        shell: bash
        run: |
          set -euo pipefail
          image='mcr.microsoft.com/powershell:7.4-ubuntu-22.04'
          docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | tee base-image-manifest.json
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          echo "BASE_IMAGE_PIN: ${image}@${digest}"

      - name: Upload the generated lock file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsc-checksums
          path: |
            dsc-checksums.generated.json
            base-image-manifest.json
          if-no-files-found: error
