name: Azure DevOps Real Lifecycle Self-Hosted

# Proves the full end-to-end path against a live Azure DevOps organization: compile the real
# Datum Example Configuration through the runner, authenticate with managed identity via the
# AzureDevOpsDscNative resource module, then genuinely build and tear down the environment
# through the real runner + real Invoke-DscResource (no engine or auth mocks). This needs the
# IMDS metadata endpoint (system-assigned managed identity), a real Azure DevOps org, and the
# AzureDevOpsDscNative module, so it runs on a self-hosted runner rather than the hosted Linux
# agents.
#
# Configuration:
#   - vars.AZUREDEVOPSORG (repository Actions variable): the Azure DevOps organization the suite
#     targets; overrides the Example Configuration's Organization_Name at runtime. Defaults to
#     'akkodistestorg' when unset.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

  # Reused as a release gate by the tag-driven Release workflow.
  workflow_call:

# Serialize (don't cancel) superseded runs for the same branch/PR: this workflow does real
# build/teardown against a live Azure DevOps org, so killing an in-progress run mid-teardown
# would risk leaving the org in an inconsistent state.
# The group key names this workflow literally instead of using ${{ github.workflow }}. Inside a
# `workflow_call` invocation that expression resolves to the CALLING workflow's name, so every
# gate Release.yml reuses would land in one shared group and the gates that cancel in progress
# would cancel their siblings before a runner was ever assigned to them.
concurrency:
  group: azdo-selfhosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  azuredevops-selfhosted:
    name: Azure DevOps real lifecycle on self-hosted
    runs-on: [self-hosted]

    env:
      # The AzureDevOpsDsc.Common managed-identity provider requires a writable cache directory
      # or it throws before authenticating. Point it at a per-run workspace folder.
      AZDODSC_CACHE_DIRECTORY: ${{ github.workspace }}/.azdodsc-cache
      # Repo-level Actions variable; the suite falls back to the config's Organization_Name
      # (and ultimately 'akkodistestorg') when this is unset.
      AZUREDEVOPSORG: ${{ vars.AZUREDEVOPSORG }}
      # The AzureDevOpsDscNative version the suite runs against. Pinned so a new gallery release
      # (or whatever happens to be installed on a runner) cannot change what CI exercises; the
      # dependency step installs exactly this version and the suite imports exactly this version.
      AZDODSCNATIVE_VERSION: '1.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Ensure cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:AZDODSC_CACHE_DIRECTORY | Out-Null

      # Install only what is missing so a warm runner is not re-provisioned every run.
      #  - Pester is pinned to the 5.x line (New-PesterConfiguration's schema differs across
      #    major versions). -SkipPublisherCheck is required because the runner ships an older
      #    Pester (4.x) signed by a different Authenticode publisher.
      #  - powershell-yaml / datum / datum.invokecommand compile the Example Configuration.
      #  - AzureDevOpsDscNative provides the AzDo* DSC resources and the bundled
      #    AzureDevOpsDsc.Common managed-identity provider; it is prerelease on the gallery.
      #  - DscResource.Common is a runtime dependency of AzureDevOpsDsc.Common (it exports
      #    Get-LocalizedData, which AzureDevOpsDsc.Common.psm1 calls at import time) that is not
      #    declared on PSModulePath by AzureDevOpsDscNative's own manifest, so it must be ensured
      #    here explicitly or the import throws "Get-LocalizedData is not recognized".
      - name: Ensure PowerShell dependencies
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -eq 5 })) {
            Write-Host "Installing Pester (5.x) ..."
            Install-Module -Name Pester -MinimumVersion '5.0.0' -MaximumVersion '5.9999.9999' `
              -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          }
          foreach ($m in 'powershell-yaml','datum','datum.invokecommand','DscResource.Common') {
            if (-not (Get-Module -ListAvailable -Name $m)) {
              Write-Host "Installing $m ..."
              Install-Module -Name $m -Force -Scope CurrentUser -AllowClobber
            }
          }
          # AzureDevOpsDscNative is pinned to AZDODSCNATIVE_VERSION. Invoke-DscResource, Get-DscResource
          # and dsc's PowerShell adapter resolve the module by name and take the highest version they
          # find, so other copies this job installed into the runner account's CurrentUser scope are
          # removed first; a copy installed outside that scope is reported, not touched.
          $pinned = [version]$env:AZDODSCNATIVE_VERSION
          $userModuleRoot = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell/Modules/AzureDevOpsDscNative'
          Get-ChildItem -LiteralPath $userModuleRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne $env:AZDODSCNATIVE_VERSION } |
            ForEach-Object {
              Write-Host "Removing AzureDevOpsDscNative $($_.Name) from $userModuleRoot ..."
              Remove-Item -LiteralPath $_.FullName -Recurse -Force
            }
          if (-not (Get-Module -ListAvailable -Name AzureDevOpsDscNative | Where-Object { $_.Version -eq $pinned })) {
            Write-Host "Installing AzureDevOpsDscNative $env:AZDODSCNATIVE_VERSION ..."
            Install-Module -Name AzureDevOpsDscNative -RequiredVersion $env:AZDODSCNATIVE_VERSION -AllowPrerelease `
              -Force -Scope CurrentUser -AllowClobber
          }
          Get-Module -ListAvailable -Name AzureDevOpsDscNative | Where-Object { $_.Version -ne $pinned } |
            ForEach-Object { Write-Warning "AzureDevOpsDscNative $($_.Version) is also installed at $($_.ModuleBase); remove it so it cannot shadow $pinned." }

      - name: Report environment
        shell: pwsh
        run: |
          $PSVersionTable | Format-List
          Get-Module -ListAvailable -Name AzureDevOpsDscNative | Format-List Name, Version, Path
          Get-Command Invoke-DscResource | Format-List Name, Source, Version

      # Compile the real Datum Example Configuration and drive a genuine build/teardown against
      # the live Azure DevOps org via managed identity (no mocks).
      - name: Run Azure DevOps real-lifecycle integration tests
        shell: pwsh
        run: ./scripts/Invoke-AzureDevOpsSelfHostedTests.ps1

      # Publish the invocation results (NUnit XML) as a build artifact, even when the suite fails,
      # so the record of the real build/teardown run is downloadable from the run summary.
      - name: Publish invocation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azuredevops-real-lifecycle-results
          path: output/testResults/AzureDevOps-RealLifecycle.TestResults.xml
          if-no-files-found: warn
