# This is a basic workflow to help you get started with Actions

name: Run Code Coverage

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Reused as a release gate by the tag-driven Release workflow.
  workflow_call:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Guard against the deprecated 'LCM' name creeping back into live code. The
      # rename to Dsc.PipelineRunner is complete; only the CHANGELOG migration guide
      # (and this plan's docs) may reference the old AZDO-DSC-LCM identifiers.
      - name: Guard against reintroduced 'LCM' references
        shell: bash
        run: |
          matches=$(grep -rniI 'lcm' source Actions "Pipeline Rules" || true)
          if [ -n "$matches" ]; then
            echo "Found 'LCM' references in live code — the module was renamed to Dsc.PipelineRunner:"
            echo "$matches"
            exit 1
          fi
          echo "No 'LCM' references in live code."

      - name: Download PowerShell Dependencies
        shell: pwsh
        run: Install-Module Datum, Datum.InvokeCommand, powershell-yaml, PSDesiredStateConfiguration -Force

      - name: Perform a Pester Test to ensure that the .\tests.ps1 script exists
        shell: pwsh
        run: Test-Path .\tests.ps1 | Should -be $true
        
      # Runs a set of commands using the runners shell
      - name: Run tests.ps1 - Perform Code Coverage
        shell: pwsh
        run: . .\tests.ps1
          
