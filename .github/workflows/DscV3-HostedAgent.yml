name: DSC v3 Hosted Agent

# Proves the DSC v3 (dsc.exe) engine path works on a clean hosted Linux agent:
# bootstrap the dsc executable, then drive a real resource through the runner's
# DscV3 engine and assert a contract-valid result. This is the Phase 3 hosted-agent
# validation gate — Invoke-DscResource (DSC v2) is Windows-first, so the v3 path is
# what makes Linux/macOS agents genuinely useful.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

  # Reused as a release gate by the tag-driven Release workflow.
  workflow_call:

# Least-privilege token: nothing in this workflow writes back to the repository.
permissions:
  contents: read

# Cancel a superseded run for the same branch/PR instead of letting duplicate push+pull_request
# runs (or back-to-back pushes) pile up and race each other.
# The group key names this workflow literally instead of using ${{ github.workflow }}. Inside a
# `workflow_call` invocation that expression resolves to the CALLING workflow's name, so every
# gate Release.yml reuses would land in one shared group and the gates that cancel in progress
# would cancel their siblings before a runner was ever assigned to them.
concurrency:
  group: dsc-v3-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsc-v3-linux:
    name: DSC v3 engine on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the DSC v3 command-line engine using the repo's bootstrap script. The
      # script appends dsc's directory to $GITHUB_PATH, so later steps find it on PATH.
      - name: Bootstrap DSC v3 (dsc)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Install-DscV3.ps1 -Verbose

      - name: Report dsc version and available resources
        shell: pwsh
        run: |
          dsc --version
          dsc resource list

      # Exercise the module's real DscV3 engine action against a live resource.
      - name: Run DSC v3 engine smoke test
        shell: pwsh
        run: ./scripts/Test-DscV3Smoke.ps1 -Verbose

      # Prove a compiled configuration, converted by ConvertTo-DscV3ConfigurationDocument,
      # is a valid DSC v3 document that dsc.exe accepts and evaluates.
      - name: Verify compiled configuration is DSC v3-compliant
        shell: pwsh
        run: ./scripts/Test-DscV3ConfigDocument.ps1 -Verbose

      # How long one dsc call takes with full and with narrowed resource discovery (see
      # docs/dsc-v3.md#resource-discovery). The table goes to the job summary.
      - name: Time dsc calls through the engine
        shell: pwsh
        run: ./scripts/Measure-DscV3Calls.ps1 -Property @{ family = 'Linux' }

  dsc-v3-windows:
    name: DSC v3 engine on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap DSC v3 (dsc)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Install-DscV3.ps1 -Verbose

      - name: Report dsc version and the Windows resources
        shell: pwsh
        run: |
          dsc --version
          dsc resource list 'Microsoft.Windows/*'

      - name: Run DSC v3 engine smoke test
        shell: pwsh
        run: ./scripts/Test-DscV3Smoke.ps1 -Verbose

      # On a hosted Windows agent the PowerShell discover extension that every full discovery
      # starts costs seconds, which is what the narrowing removes. Microsoft.Windows/Registry
      # is the native resource a Windows configuration uses most; the key is only read.
      - name: Time dsc calls through the engine
        shell: pwsh
        run: |
          ./scripts/Measure-DscV3Calls.ps1 -Property @{ family = 'Windows' }
          ./scripts/Measure-DscV3Calls.ps1 -Verbose -ResourceType 'Microsoft.Windows/Registry' -Property @{ keyPath = 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; valueName = 'ProductName' }

  # Validate the hosted-agent container image builds and its dsc bootstrap works.
  dsc-agent-image:
    name: Build DSC v3 agent image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer queries the GitHub API for the release asset. Anonymous calls from a shared
      # runner IP are rate limited, so the workflow's read-only token is handed to the build as a
      # BuildKit secret (mounted for that one step; never stored in the image or its history).
      - name: Build the hosted-agent image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --secret id=github_token,env=GITHUB_TOKEN -f containers/dsc-agent/Dockerfile -t dsc-pipelinerunner-agent:ci .

      - name: Verify dsc runs inside the image
        run: docker run --rm dsc-pipelinerunner-agent:ci dsc --version
