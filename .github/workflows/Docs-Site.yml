# Builds the documentation site on every pull request, so a broken link in README.md, docs/,
# WikiSource/ or the other pages fails the pull request rather than the Pages deployment.
#
# The site is assembled by tools/build-site.js (unit-tested here first), built by mdBook
# (book.toml), and every link in the result is checked by tools/check-site.js. Pages.yml
# publishes the same build on pushes to main. See docs/documentation-site.md.
name: Documentation site (build gate)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  docs-site:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Restore mdBook
        id: mdbook
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-${{ env.MDBOOK_VERSION }}

      - name: Install mdBook
        if: steps.mdbook.outputs.cache-hit != 'true'
        run: cargo install --locked mdbook --version "$MDBOOK_VERSION"

      - name: Unit tests of the site builder
        run: node --test tools/build-site.test.js

      - name: Build the wiki content (for the command reference)
        shell: pwsh
        run: ./scripts/Build-WikiContent.ps1 -SourcePath $PWD -OutputPath ./output/WikiContent

      - name: Assemble, build and check the site
        run: |
          node tools/build-site.js --wiki-content output/WikiContent
          mdbook build
          node tools/check-site.js site --site-url=/Dsc.PipelineRunner/

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site
          if-no-files-found: error
