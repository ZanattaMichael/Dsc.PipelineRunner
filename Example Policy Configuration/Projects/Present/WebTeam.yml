# An application team's node. Owned by that team (layer 'Teams' in Policy.yml).
parameters: {}

variables:
  SiteName: web-frontend

resources:

  # Replaces the platform's 'Log level' by name. What runs is this version, and it is held to
  # this team's permissions.
  - name: Log level
    type: PSDscResources/Environment
    properties:
      Name: APP_LOG_LEVEL
      Value: Information
      Ensure: Present
      Target:
        - Machine

  # The team's own resource, on the default Target (Local).
  - name: Site name
    type: PSDscResources/Environment
    properties:
      Name: APP_SITE_NAME
      Value: $(variables('SiteName'))
      Ensure: Present
      Target:
        - Machine

  # Allowed for this layer: WinRM is in its Targets, web01 is in its RemoteTargets, and the
  # credential comes from the agent's environment, which is the one Credential action the team
  # has. Change any one of the three and the file does not start.
  - name: Site name on the web server
    type: PSDscResources/Environment
    target:
      action: WinRM
      computerName: web01.app.contoso.example
      credential:
        action: Environment
        UserNameVariable: WEB_DEPLOY_USER
        PasswordVariable: WEB_DEPLOY_PASSWORD
    properties:
      Name: APP_SITE_NAME
      Value: $(variables('SiteName'))
      Ensure: Present
      Target:
        - Machine
